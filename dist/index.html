<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="IMG.LY 자동 배경제거 결과를 삭제·복원 브러시로 정밀하게 보정하는 브라우저 편집기">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232f6fed'/%3E%3Cpath d='M18 44 43 19l4 4-25 25H18v-4Z' fill='white'/%3E%3Cpath d='m39 15 10 10 4-4-10-10-4 4Z' fill='%239ec1ff'/%3E%3C/svg%3E">
  <title>IMG.LY 배경제거 편집기</title>
  <style>
    :root{color-scheme:dark;--bg:#101217;--panel:#191d25;--panel2:#202630;--line:#333b48;--text:#f5f7fa;--muted:#9da8b7;--blue:#4b88ff;--red:#ff4d66;--green:#57d69b}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,Pretendard,"Noto Sans KR",system-ui,sans-serif}button,input{font:inherit}button{color:inherit}
    .app{min-height:100vh;display:grid;grid-template-rows:auto 1fr}.topbar{min-height:72px;padding:12px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;background:#15181f;position:relative;z-index:3}
    .brand{font-size:1.15rem;font-weight:800;letter-spacing:-.035em;margin-right:auto}.brand small{display:block;color:var(--muted);font-size:.76rem;font-weight:500;margin-top:3px;letter-spacing:0}
    button,.filebtn{border:1px solid var(--line);background:var(--panel2);border-radius:10px;min-height:42px;padding:0 14px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px}
    button:hover:not(:disabled),.filebtn:hover{filter:brightness(1.12)}button:disabled{opacity:.38;cursor:not-allowed}.primary{background:var(--blue);border-color:var(--blue)}.download{background:#f5f7fa;color:#151922;border-color:#f5f7fa}.filebtn input{display:none}
    .workspace{min-height:0;display:grid;grid-template-columns:minmax(0,1fr);gap:16px;padding:16px}.app.editing .workspace{grid-template-columns:minmax(0,1fr) 300px}.stage-wrap{min-width:0;min-height:560px;background:#15181f;border:1px solid var(--line);border-radius:16px;overflow:hidden;display:grid;grid-template-rows:auto 1fr}
    .stage-head{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px;color:var(--muted);font-size:.86rem}.stage-head .status{margin-left:auto}.status.busy{color:#88b1ff}.status.error{color:#ff8797}.status.ok{color:var(--green)}
    .stage{position:relative;overflow:auto;display:grid;place-items:center;padding:28px;background-color:#edf0f2;background-image:linear-gradient(45deg,#d4d9dd 25%,transparent 25%),linear-gradient(-45deg,#d4d9dd 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#d4d9dd 75%),linear-gradient(-45deg,transparent 75%,#d4d9dd 75%);background-size:28px 28px;background-position:0 0,0 14px,14px -14px,-14px 0}
    .stage.drag{outline:3px solid var(--blue);outline-offset:-6px}.placeholder{color:#5e6875;text-align:center;line-height:1.7;padding:32px}.placeholder b{display:block;color:#333c48;font-size:1.08rem;margin-bottom:6px}.stage.ready .placeholder{display:none}
    canvas{display:none;max-width:none;box-shadow:0 12px 40px #1118;touch-action:none;cursor:none}.stage.ready canvas{display:block}.brush-cursor{position:fixed;display:none;border:1.5px solid #fff;border-radius:50%;pointer-events:none;z-index:20;box-shadow:0 0 0 1px #0008;transform:translate(-50%,-50%)}
    .panel{display:none;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;align-self:start}.app.editing .panel{display:block}.panel h2{font-size:1rem;margin:0 0 13px}.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tool.active{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue);color:#9ec1ff}.tool.erase.active{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red);color:#ff9bab}#edit.active{border-color:var(--blue);background:#223b69;color:#b8d0ff}
    .section{border-top:1px solid var(--line);margin-top:16px;padding-top:16px}.range-row{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:14px}.range-row label{font-size:.88rem}.value{color:#b9c6d7;font-size:.82rem}.range-row input{grid-column:1/-1;width:100%;accent-color:var(--blue)}
    .history{display:grid;grid-template-columns:1fr 1fr;gap:8px}.history button{font-weight:600}.zoom{display:flex;align-items:center;justify-content:space-between;gap:8px}.zoom button{width:42px;padding:0}.zoom span{font-variant-numeric:tabular-nums;color:#c5d0df}
    .hint{font-size:.78rem;line-height:1.6;color:var(--muted);margin:15px 0 0}.device{margin-top:12px;padding:10px 11px;background:#141820;border-radius:9px;color:var(--muted);font-size:.78rem}.device b{color:#dce5f1}
    @media(max-width:850px){.topbar{flex-wrap:wrap;padding:10px 14px}.brand{width:100%}.workspace,.app.editing .workspace{grid-template-columns:1fr;padding:10px}.stage-wrap{min-height:55vh}.panel{width:100%}.topbar .primary,.topbar .download,.topbar #edit,.filebtn{flex:1}.stage{padding:16px}}
  </style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">IMG.LY 배경제거 편집기<small>자동 분리 후 필요한 부분만 직접 삭제하거나 복원합니다.</small></div>
    <label class="filebtn">사진 선택<input id="file" type="file" accept="image/*"></label>
    <button id="remove" class="primary" disabled>자동 배경제거</button>
    <button id="edit" aria-expanded="false" disabled>배경제거 편집</button>
    <button id="download" class="download" disabled>PNG 다운로드</button>
  </header>
  <main class="workspace">
    <section class="stage-wrap">
      <div class="stage-head"><span id="dimensions">이미지 없음</span><span class="status" id="status">사진을 선택하거나 끌어놓으세요.</span></div>
      <div class="stage" id="stage">
        <div class="placeholder"><b>편집할 사진을 올려주세요</b>파일 선택 · 드래그&드롭 · Ctrl+V</div>
        <canvas id="canvas"></canvas>
      </div>
    </section>
    <aside class="panel">
      <h2>마스크 브러시</h2>
      <div class="tools">
        <button class="tool erase" id="erase">− 삭제</button>
        <button class="tool" id="restore">＋ 복원</button>
      </div>
      <div class="section">
        <div class="range-row"><label for="size">브러시 크기</label><span class="value" id="sizeValue">60 px</span><input id="size" type="range" min="5" max="240" value="60"></div>
        <div class="range-row"><label for="hardness">가장자리 선명도</label><span class="value" id="hardValue">75%</span><input id="hardness" type="range" min="0" max="100" value="75"></div>
      </div>
      <div class="section history">
        <button id="undo" disabled>↶ 실행 취소</button><button id="redo" disabled>↷ 다시 실행</button>
        <button id="reset" style="grid-column:1/-1" disabled>AI 결과로 초기화</button>
      </div>
      <div class="section zoom">
        <button id="zoomOut" disabled>−</button><span id="zoomValue">100%</span><button id="zoomIn" disabled>＋</button>
      </div>
      <p class="hint">마우스나 손가락으로 칠해 보정합니다. 삭제는 투명하게, 복원은 원본 픽셀을 되살립니다. Ctrl+Z와 Ctrl+Y도 사용할 수 있습니다.</p>
      <div class="device">처리 방식: <b id="device">IMG.LY IS-Net · 대기</b><br>사진은 서버로 전송되지 않습니다.</div>
    </aside>
  </main>
</div>
<div class="brush-cursor" id="cursor"></div>
<script type="module">
  const $=s=>document.querySelector(s),canvas=$('#canvas'),ctx=canvas.getContext('2d',{willReadFrequently:true}),stage=$('#stage'),statusEl=$('#status'),cursor=$('#cursor');
  const app=$('.app'),ui={file:$('#file'),remove:$('#remove'),edit:$('#edit'),download:$('#download'),erase:$('#erase'),restore:$('#restore'),size:$('#size'),hardness:$('#hardness'),undo:$('#undo'),redo:$('#redo'),reset:$('#reset'),zoomIn:$('#zoomIn'),zoomOut:$('#zoomOut')};
  let sourceData=null,renderData=null,aiMask=null,mask=null,sourceBlob=null,removeBackground=null,mode=null,zoom=1,fitWidth=0,drawing=false,lastPoint=null,currentChanges=null,undoStack=[],redoStack=[],renderPending=false;
  const setStatus=(text,type='')=>{statusEl.textContent=text;statusEl.className='status '+type};
  const setEnabled=ready=>{ui.remove.disabled=!ready;ui.edit.disabled=!ready||!mask;ui.download.disabled=!ready||!mask;ui.reset.disabled=!ready||!aiMask;ui.undo.disabled=!ready||!undoStack.length;ui.redo.disabled=!ready||!redoStack.length;ui.zoomIn.disabled=ui.zoomOut.disabled=!ready};
  const canvasBlob=(c,type='image/png',quality=1)=>new Promise((resolve,reject)=>c.toBlob(b=>b?resolve(b):reject(new Error('이미지 변환에 실패했습니다.')),type,quality));
  function updateHistory(){ui.undo.disabled=!undoStack.length;ui.redo.disabled=!redoStack.length}
  function updateZoom(){if(!canvas.width)return;canvas.style.width=Math.round(fitWidth*zoom)+'px';canvas.style.height='auto';$('#zoomValue').textContent=Math.round(zoom*100)+'%'}
  function calculateFit(){fitWidth=Math.min(canvas.width,Math.max(280,stage.clientWidth-56));updateZoom()}
  function scheduleRender(){if(renderPending)return;renderPending=true;requestAnimationFrame(()=>{renderPending=false;render()})}
  function render(){if(!sourceData)return;if(!renderData||renderData.width!==sourceData.width)renderData=new ImageData(new Uint8ClampedArray(sourceData.data),sourceData.width,sourceData.height);renderData.data.set(sourceData.data);if(mask)for(let i=0,j=3;i<mask.length;i++,j+=4)renderData.data[j]=mask[i];ctx.putImageData(renderData,0,0)}
  async function loadFile(file){if(!file||!file.type.startsWith('image/'))return setStatus('이미지 파일을 선택해 주세요.','error');setStatus('이미지를 준비하는 중…','busy');app.classList.remove('editing');ui.edit.classList.remove('active');ui.edit.setAttribute('aria-expanded','false');setMode(null);const url=URL.createObjectURL(file),img=new Image();img.src=url;await img.decode();const max=2500,scale=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));canvas.width=Math.round(img.naturalWidth*scale);canvas.height=Math.round(img.naturalHeight*scale);ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);URL.revokeObjectURL(url);sourceData=ctx.getImageData(0,0,canvas.width,canvas.height);sourceBlob=await canvasBlob(canvas,'image/png');mask=aiMask=null;undoStack=[];redoStack=[];renderData=null;stage.classList.add('ready');$('#dimensions').textContent=canvas.width+' × '+canvas.height;zoom=1;calculateFit();render();updateHistory();setEnabled(true);setStatus('자동 배경제거를 실행해 주세요.');}
  async function runRemoval(){setEnabled(false);ui.remove.disabled=true;setStatus('IMG.LY 모델을 준비하는 중…','busy');try{if(!removeBackground){const mod=await import('https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.7.0/+esm');removeBackground=mod.removeBackground||mod.default;if(typeof removeBackground!=='function')throw new Error('IMG.LY 모듈을 불러오지 못했습니다.')}const device=navigator.gpu?'gpu':'cpu';$('#device').textContent='IMG.LY IS-Net · '+device.toUpperCase();const result=await removeBackground(sourceBlob,{device,model:'isnet_fp16',output:{format:'image/png',quality:1,type:'foreground'},progress:(key,current,total)=>{const pct=total?Math.round(current/total*100):0;setStatus('모델 다운로드 '+pct+'%','busy')}});const url=URL.createObjectURL(result),cutout=new Image();cutout.src=url;await cutout.decode();const temp=document.createElement('canvas');temp.width=canvas.width;temp.height=canvas.height;temp.getContext('2d').drawImage(cutout,0,0,temp.width,temp.height);URL.revokeObjectURL(url);const data=temp.getContext('2d').getImageData(0,0,temp.width,temp.height).data;mask=new Uint8ClampedArray(canvas.width*canvas.height);for(let i=0,j=3;i<mask.length;i++,j+=4)mask[i]=data[j];aiMask=new Uint8ClampedArray(mask);undoStack=[];redoStack=[];renderData=null;app.classList.remove('editing');ui.edit.classList.remove('active');ui.edit.setAttribute('aria-expanded','false');setMode(null);render();updateHistory();setStatus('완료되었습니다. 배경제거 편집을 눌러 세부 조정할 수 있습니다.','ok')}catch(e){console.error(e);setStatus('실행하지 못했습니다: '+(e?.message||e),'error')}finally{setEnabled(!!sourceData)}}
  function pointFromEvent(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height,scale:canvas.width/r.width}}
  function paintPoint(p){if(!mask)return;const radius=(+ui.size.value/2)*p.scale,hard=+ui.hardness.value/100,inner=radius*hard,x0=Math.max(0,Math.floor(p.x-radius)),x1=Math.min(canvas.width-1,Math.ceil(p.x+radius)),y0=Math.max(0,Math.floor(p.y-radius)),y1=Math.min(canvas.height-1,Math.ceil(p.y+radius));for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){const dist=Math.hypot(x-p.x,y-p.y);if(dist>radius)continue;const idx=y*canvas.width+x,weight=dist<=inner?1:1-(dist-inner)/Math.max(1,radius-inner),old=mask[idx],target=mode==='erase'?0:255,next=Math.round(old+(target-old)*weight);if(next===old)continue;if(!currentChanges.has(idx))currentChanges.set(idx,old);mask[idx]=next}scheduleRender()}
  function paintLine(a,b){const radius=(+ui.size.value/2)*a.scale,steps=Math.max(1,Math.ceil(Math.hypot(b.x-a.x,b.y-a.y)/Math.max(1,radius*.25)));for(let i=1;i<=steps;i++)paintPoint({x:a.x+(b.x-a.x)*i/steps,y:a.y+(b.y-a.y)*i/steps,scale:b.scale})}
  function finishStroke(){if(!drawing)return;drawing=false;lastPoint=null;if(currentChanges?.size){const indices=new Uint32Array(currentChanges.size),before=new Uint8ClampedArray(currentChanges.size),after=new Uint8ClampedArray(currentChanges.size);let n=0;for(const [idx,old] of currentChanges){indices[n]=idx;before[n]=old;after[n]=mask[idx];n++}undoStack.push({indices,before,after});if(undoStack.length>30)undoStack.shift();redoStack=[];updateHistory()}currentChanges=null}
  canvas.addEventListener('pointerdown',e=>{if(!mask||!mode)return;e.preventDefault();drawing=true;currentChanges=new Map();lastPoint=pointFromEvent(e);canvas.setPointerCapture(e.pointerId);paintPoint(lastPoint)});
  canvas.addEventListener('pointermove',e=>{cursor.style.display=mask&&mode&&app.classList.contains('editing')?'block':'none';cursor.style.left=e.clientX+'px';cursor.style.top=e.clientY+'px';cursor.style.width=cursor.style.height=ui.size.value+'px';cursor.style.borderColor=mode==='erase'?'#ff4d66':'#57d69b';if(!drawing)return;const p=pointFromEvent(e);paintLine(lastPoint,p);lastPoint=p});
  canvas.addEventListener('pointerup',finishStroke);canvas.addEventListener('pointercancel',finishStroke);canvas.addEventListener('pointerleave',()=>{cursor.style.display='none'});
  function applyHistory(entry,values){for(let i=0;i<entry.indices.length;i++)mask[entry.indices[i]]=values[i];render()}
  function undo(){const e=undoStack.pop();if(!e)return;applyHistory(e,e.before);redoStack.push(e);updateHistory()}function redo(){const e=redoStack.pop();if(!e)return;applyHistory(e,e.after);undoStack.push(e);updateHistory()}
  function setMode(next){mode=next;ui.erase.classList.toggle('active',next==='erase');ui.restore.classList.toggle('active',next==='restore')}
  ui.file.onchange=e=>loadFile(e.target.files[0]);ui.remove.onclick=runRemoval;ui.edit.onclick=()=>{const open=app.classList.toggle('editing');ui.edit.classList.toggle('active',open);ui.edit.setAttribute('aria-expanded',String(open));if(!open)setMode(null);requestAnimationFrame(calculateFit)};ui.erase.onclick=()=>setMode('erase');ui.restore.onclick=()=>setMode('restore');ui.undo.onclick=undo;ui.redo.onclick=redo;
  ui.reset.onclick=()=>{if(!aiMask)return;mask=new Uint8ClampedArray(aiMask);undoStack=[];redoStack=[];render();updateHistory();setStatus('AI 결과로 초기화했습니다.','ok')};
  ui.size.oninput=()=>$('#sizeValue').textContent=ui.size.value+' px';ui.hardness.oninput=()=>$('#hardValue').textContent=ui.hardness.value+'%';
  ui.zoomIn.onclick=()=>{zoom=Math.min(4,zoom+.25);updateZoom()};ui.zoomOut.onclick=()=>{zoom=Math.max(.5,zoom-.25);updateZoom()};
  ui.download.onclick=async()=>{if(!mask)return;render();const blob=await canvasBlob(canvas),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='background-removed.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
  for(const ev of ['dragenter','dragover'])stage.addEventListener(ev,e=>{e.preventDefault();stage.classList.add('drag')});for(const ev of ['dragleave','drop'])stage.addEventListener(ev,e=>{e.preventDefault();stage.classList.remove('drag')});stage.addEventListener('drop',e=>loadFile(e.dataTransfer.files[0]));
  document.addEventListener('paste',e=>{const f=[...e.clipboardData.files].find(x=>x.type.startsWith('image/'));if(f)loadFile(f)});document.addEventListener('keydown',e=>{if(!(e.ctrlKey||e.metaKey))return;if(e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo()}if(e.key.toLowerCase()==='y'){e.preventDefault();redo()}});
  window.addEventListener('resize',()=>{if(canvas.width)calculateFit()});
</script>
</body>
</html>
